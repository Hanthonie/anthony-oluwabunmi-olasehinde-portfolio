<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anthony Olasehinde | Frontend Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1437;--blue:#3B5BFF;--amber:#FFB020;--pink:#FF4FA3;--bg:#F4F6FB;--mut:#52587a;--line:#dde1f0;--d:'Bricolage Grotesque','Trebuchet MS',sans-serif;--b:'Newsreader',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:80px;scroll-behavior:smooth;height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font:400 1.15rem/1.65 var(--b);overflow-x:hidden}
h1,h2,h3{font-family:var(--d);margin:0;line-height:1.08;letter-spacing:-.02em}
h2{font-size:clamp(2rem,4vw,3rem);font-weight:800;margin-bottom:14px}p{margin:0 0 14px}
a{color:inherit}:focus-visible,.up:focus-within{outline:3px solid var(--amber);outline-offset:3px}
.wrap{max-width:1160px;margin:auto;padding:0 24px}.lead{color:var(--mut);max-width:38em;margin-bottom:34px}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.05rem var(--d);text-decoration:none}
.logo i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;font-style:normal}
.nav nav{display:flex;gap:26px;font:500 .98rem var(--d)}.nav nav a{text-decoration:none;color:var(--mut)}.nav nav a:hover{color:var(--blue)}
.btn{display:inline-block;font:800 .98rem var(--d);padding:13px 24px;border-radius:999px;background:var(--amber);color:var(--navy);text-decoration:none;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.o{background:transparent;color:#fff;border:2px solid #ffffff66}.btn.b{background:var(--blue);color:#fff}
.hero{background:radial-gradient(900px 520px at 90% 30%,#7a2bd0 0,transparent 60%),var(--navy);color:#fff;padding:70px 0 80px}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:50px;align-items:center}
.hero h1{font-size:clamp(2.5rem,5.2vw,4.4rem);font-weight:800}.hero h1 em{font-style:normal;color:var(--amber)}
.hero p.lead{color:#c9d0f5;font-size:1.28rem;margin:22px 0 30px}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}.tags span{font:800 .95rem var(--d);padding:8px 16px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff30}
.shot{position:relative}.shot img{width:100%;aspect-ratio:4/3.2;object-fit:cover;border-radius:28px;display:block;box-shadow:0 30px 80px #000a;border:1px solid #ffffff33}
.badge{position:absolute;background:#fff;color:var(--navy);font:800 .9rem var(--d);padding:10px 16px;border-radius:14px;box-shadow:0 12px 30px #0006;display:flex;gap:8px;align-items:center}
.badge i{width:10px;height:10px;border-radius:50%;background:#27C99A}.b1{left:-24px;bottom:12%}.b2{right:-8px;top:8%}
section{padding:90px 0}
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.ph{margin:0;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--blue),var(--navy));border-radius:24px;aspect-ratio:1/1.05}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;color:#ffffffcc;font:500 .95rem var(--d);text-align:center;background:repeating-linear-gradient(45deg,#ffffff0d 0 12px,transparent 12px 24px)}.fb svg{width:64px;height:64px}
.up{position:absolute;left:12px;bottom:12px;background:#fff;color:var(--navy);font:800 .85rem var(--d);padding:8px 14px;border-radius:999px;cursor:pointer;overflow:hidden}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.srv{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.sv{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;transition:transform .2s,box-shadow .2s}.sv:hover{transform:translateY(-6px);box-shadow:0 20px 40px #0b143718}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c);margin-bottom:18px}.ic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sv h3{font-size:1.4rem;margin-bottom:8px}.sv p{color:var(--mut);margin:0;font-size:1.05rem}
.dark{background:var(--navy);color:#fff}.dark .lead{color:#b4bdf0}
.grp{margin-bottom:26px}.grp h3{font-size:1.1rem;color:#b4bdf0;margin-bottom:12px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:12px}.chip{font:800 1.1rem var(--d);padding:14px 24px;border-radius:14px;background:#ffffff12;border:1px solid #ffffff2a;border-left:5px solid var(--c)}
.banner{position:relative;min-height:380px;display:grid;align-items:end;color:#fff;overflow:hidden}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 82%}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0B1437f0 5%,#0B143700 70%)}
.banner .wrap{position:relative;z-index:1;padding-bottom:40px;padding-top:140px}.banner h2{font-size:clamp(1.8rem,4vw,3rem);margin:0;max-width:16em}
.xp{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px}.xl{display:flex;flex-direction:column;gap:10px}
.xb{text-align:left;font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy);padding:16px 18px;border-radius:16px;border-left:8px solid var(--c)}
.xb b{font:800 1.08rem var(--d);display:block}.xb small{color:var(--mut);font-size:.95rem}.xb[aria-selected=true]{background:var(--navy);color:#fff}.xb[aria-selected=true] small{color:#c9d0f5}
.xd{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;border-top:6px solid var(--c)}.xd h3{font-size:1.6rem}.xd small{display:block;color:var(--mut);margin:6px 0 14px;font:500 .98rem var(--d)}.xd ul{margin:0;padding-left:1.2em}.xd li{margin-bottom:8px}
.pop{animation:pop .3s ease}@keyframes pop{from{opacity:.2;transform:translateY(8px)}}
.edu{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;color:var(--mut);font-size:1.02rem}.edu div{padding:18px 20px;border:1px dashed #b9c0e0;border-radius:16px}.edu b{display:block;color:var(--navy);font:800 1rem var(--d)}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:50px}
.cl{display:grid;gap:14px;margin-top:24px}.cl a{display:flex;gap:14px;align-items:center;text-decoration:none;font:500 1.1rem var(--d);word-break:break-all}.cl .ic{margin:0;background:#ffffff1c;flex:none}
.fm{background:#fff;color:var(--navy);border-radius:24px;padding:30px;display:grid;gap:14px}.fm label{font:800 .9rem var(--d);display:grid;gap:6px}
.fm input,.fm textarea{font:1.05rem var(--b);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--navy)}
footer{background:#070d28;color:#8e98d6;padding:26px 0;font:500 .95rem var(--d)}footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

.prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:4px;z-index:30;background:linear-gradient(90deg,var(--blue),var(--pink),var(--amber));transform-origin:0 50%;transform:scaleX(0)}
.hero{position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,70%) var(--my,30%),#ff4fa340,transparent 70%);pointer-events:none}.hero .wrap{position:relative}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}@keyframes zoom{from{opacity:0;transform:scale(.92) rotate(2deg)}}@keyframes fl{50%{transform:translateY(-10px)}}@keyframes bl{50%{opacity:0}}@keyframes kb{to{transform:scale(1.1)}}
.hero .wrap>div:first-child>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.hero .wrap>div:first-child>:nth-child(2){animation-delay:.12s}.hero .wrap>div:first-child>:nth-child(3){animation-delay:.24s}.hero .wrap>div:first-child>:nth-child(4){animation-delay:.3s}.hero .wrap>div:first-child>:nth-child(5){animation-delay:.4s}
.shot{animation:zoom 1s .2s cubic-bezier(.2,.7,.2,1) both}
.wd{display:inline-block;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.b1{top:40%;bottom:auto;animation:fl 5s ease-in-out infinite}.b2{animation:fl 6s ease-in-out -2s infinite}
.code{position:absolute;right:-14px;bottom:-30px;width:min(340px,82%);background:#0d1230ee;border:1px solid #ffffff33;border-radius:16px;padding:14px 16px;font:500 .85rem/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cfd6ff;box-shadow:0 20px 50px #000a}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--pink)}.dots i:nth-child(2){background:var(--amber)}.dots i:nth-child(3){background:#27C99A}
.code pre{margin:8px 0 0;white-space:pre-wrap;min-height:7.5em;font:inherit}.cur{display:inline-block;width:7px;height:1em;background:var(--amber);vertical-align:-2px;animation:bl 1s steps(1) infinite}
.banner img{animation:kb 22s ease-in-out infinite alternate}.chip{transition:transform .2s}.chip:hover{transform:translateY(-4px) rotate(-2deg)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media(max-width:900px){.hero .wrap,.about,.srv,.edu,.cta,.xp{grid-template-columns:1fr}.b1{left:-6px}.nav nav{display:none}section{padding:60px 0}}
</style></head>
